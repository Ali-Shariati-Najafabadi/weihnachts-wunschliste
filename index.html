<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'; form-action 'none'; base-uri 'none'">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#14513a">
  <meta name="description" content="Private Weihnachts-Wunschlisten für Familie und Freunde – ohne Konto, ohne Tracking.">
  <title>Weihnachts-Wunschliste</title>
  <link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/print.css" media="print">
  <script src="js/theme.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Zum Inhalt springen</a>

  <header class="site-header">
    <div class="header-inner">
      <div class="brand">
        <img src="icons/favicon.svg" alt="" width="40" height="40">
        <h1 class="brand-name">Weihnachts-Wunschliste</h1>
      </div>
      <p id="countdown" class="countdown"></p>
      <button id="theme-toggle" class="btn btn-small btn-header" type="button"></button>
    </div>
  </header>

  <main id="main" class="container" tabindex="-1">
    <noscript>
      <p class="notice warn">Diese Seite braucht JavaScript, damit du Wunschlisten anlegen kannst. Es werden keine Daten an Server gesendet.</p>
    </noscript>
  </main>

  <div id="print-sheet" aria-hidden="true"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <footer class="site-footer">
    <div class="container">
      <p>Privat und ohne Tracking: Alle Daten bleiben in deinem Browser und in den Links, die du selbst teilst. Es gibt keine Cookies, keine Analyse-Dienste und keine externen Schriften.</p>
      <p>© 2026 Ali Shariati Najafabadi · MIT-Lizenz</p>
    </div>
  </footer>

  <script type="module" src="js/app.js"></script>
</body>
</html>
